# Runs the backend and mobile tests on every pull request and on pushes to
# dev/main. No secrets: tests use a throwaway MongoDB, the dev sign-in user
# and no Google key (see tests/conftest.py).
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

# a newer push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + flake8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGO_URI: mongodb://localhost:27017
      DEV_AUTH_BYPASS: "true"
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      # same CPU-only torch as the Dockerfile (the default one is ~2 GB bigger)
      - name: Install dependencies
        run: |
          pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      # the embedding model, downloaded once and reused by later runs
      - uses: actions/cache@v5
        with:
          path: .hf-cache
          key: hf-all-MiniLM-L6-v2

      - name: flake8
        run: flake8 --max-line-length 120 --exclude .git,mobile,.hf-cache .

      - name: pytest
        run: python -m pytest -q

  mobile:
    name: Mobile (jest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci --no-audit --no-fund

      - run: npm test -- --runInBand --ci
